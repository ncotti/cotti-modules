name: "SystemVerilog compiler"
description: <
  Checks that all SystemVerilog files pass the linter, compiler, formatter
  and the provided testbenches.
on: push

jobs:
  sv_compiler:
    runs-on: ubuntu-latest
    env:
      REPO_PATH: .
    steps:
      - name: "Checkout project repo"
        uses: actions/checkout@v5
        with:
          path: ${{ env.REPO_PATH }}

      - name: "Compile and test"
        shell: bash
        run: |
          make -C ${{ env.REPO_PATH }} vfmt FMT_CHECK=1
          make -C ${{ env.REPO_PATH }} vcompile
          make -C ${{ env.REPO_PATH }} vrun V_TB_TOP=""
